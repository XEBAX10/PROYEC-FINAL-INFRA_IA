services:

  motor:
    build: ./motor
    container_name: mancala-motor
    environment:
      MOTOR_PORT: "8001"
      OMP_NUM_THREADS: "4"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mancala-backend
    environment:
      MOTOR_URL: "http://motor:8001"
      CORS_ORIGINS: "http://localhost:8080,http://frontend"
    ports:
      - "8000:8000"
    depends_on:
      motor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: mancala-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
