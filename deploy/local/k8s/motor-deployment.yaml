apiVersion: apps/v1
kind: Deployment
metadata:
  name: motor
  namespace: default
  labels:
    app: motor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: motor
  template:
    metadata:
      labels:
        app: motor
    spec:
      containers:
        - name: motor
          image: ghcr.io/OWNER/mancala-motor:VERSION
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: mancala-config
          env:
            - name: MOTOR_PORT
              valueFrom:
                configMapKeyRef:
                  name: mancala-config
                  key: MOTOR_PORT
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: motor-svc
  namespace: default
spec:
  selector:
    app: motor
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
