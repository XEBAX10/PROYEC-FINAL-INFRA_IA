apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mancala
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/mancala-backend:VERSION
          ports:
            - containerPort: 8000
          env:
            - name: MOTOR_URL
              value: "http://motor-svc:8001"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: mancala-config
                  key: CORS_ORIGINS
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: mancala
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
